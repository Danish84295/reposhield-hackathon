name: RepoShield Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: RepoShield Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build RepoShield
        run: |
          g++ -std=c++17 \
            src/main.cpp \
            src/core/FileScanner.cpp \
            src/core/RepositoryStats.cpp \
            src/codelens/CodeLens.cpp \
            src/security/SecurityAnalyzer.cpp \
            src/supplychain/DependencyAnalyzer.cpp \
            src/graph/DependencyGraph.cpp \
            src/risk/RiskScorer.cpp \
            src/remediation/RemediationEngine.cpp \
            src/reporting/HealthReport.cpp \
            src/reporting/JsonReport.cpp \
            src/reporting/SarifReport.cpp \
            src/git/GitAnalyzer.cpp \
            src/config/Config.cpp \
            -I src \
            -o reposhield

      - name: Run RepoShield
        id: reposhield
        run: |
          echo "Running RepoShield analysis..."

          set +e

          ./reposhield analyze demo-target --json reposhield-report.json
          REPOSHIELD_EXIT=$?

          echo "RepoShield exit code: $REPOSHIELD_EXIT"

          echo "Running SARIF generation..."

          ./reposhield analyze demo-target --sarif reposhield-results.sarif
          SARIF_EXIT=$?

          echo "SARIF generation exit code: $SARIF_EXIT"

          echo "REPOSHIELD_EXIT=$REPOSHIELD_EXIT" >> "$GITHUB_ENV"
          echo "SARIF_EXIT=$SARIF_EXIT" >> "$GITHUB_ENV"

          exit 0

      - name: Display security report
        run: |
          echo "========================================"
          echo "        REPOSHIELD JSON REPORT"
          echo "========================================"
          echo ""

          cat reposhield-report.json

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reposhield-results.sarif

      - name: CI Security Gate
        if: always()
        run: |
          CRITICAL=$(grep -o '"severity": "CRITICAL"' reposhield-report.json | wc -l)
          HIGH=$(grep -o '"severity": "HIGH"' reposhield-report.json | wc -l)

          echo "========================================"
          echo "          REPOSHIELD SECURITY GATE"
          echo "========================================"
          echo ""
          echo "Critical issues: $CRITICAL"
          echo "High issues:     $HIGH"
          echo ""

          if [ "$REPOSHIELD_EXIT" -ne 0 ]; then
            echo "========================================"
            echo "        SECURITY GATE FAILED"
            echo "========================================"
            echo ""
            echo "RepoShield security policy failed."
            echo "Critical or High severity vulnerabilities were detected."
            echo ""
            echo "Fix these vulnerabilities before merging."
            exit 1
          fi

          echo "========================================"
          echo "        SECURITY GATE PASSED"
          echo "========================================"
          echo ""
          echo "No policy violations detected."
